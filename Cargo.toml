[package]
name = "mdprint"
version = "0.2.1"
edition = "2024"
rust-version = "1.88"
description = "Markdown → print-quality self-contained HTML. One static binary with Czech typography, KaTeX math and syntax highlighting."
license = "MIT OR Apache-2.0"
repository = "https://github.com/filip-cokesh/mdprint"
readme = "README.md"
keywords = ["markdown", "html", "print", "typography", "cli"]
categories = ["command-line-utilities", "text-processing"]
# pozn.: mdprint.ico v balíčku zůstává — potřebuje ho build.rs (ikona exe)
exclude = [
    "tests/fixtures/*",
    "tests/snapshots/*",
    "assets/logo/*.png",
    ".github/*",
]

[dependencies]
anyhow = "1"
base64 = "0.22"
blake3 = "1"
minijinja = "2"
clap = { version = "4", features = ["derive"] }
comrak = "0.54"
deunicode = "1"
percent-encoding = "2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
serde_yaml = "0.9"
thiserror = "2"
toml = "0.9"
katex-rs = "0.2.4"
syntect = { version = "5.3.0", default-features = false, features = ["default-fancy"] }
fancy-regex = "0.19.0"
hyphenation = { version = "0.8.4", features = ["embed_all"] }
ureq = "3.4.0"

[target.'cfg(windows)'.build-dependencies]
winresource = "0.1"

[dev-dependencies]
insta = "1"
regex = "1.13.1"
tempfile = "3"

[profile.release]
lto = true
strip = true
codegen-units = 1
