name: Release

on:
  push:
    tags: ["v*"]

env:
  CARGO_TERM_COLOR: always

# Akce jsou připnuté na commit SHA (supply chain): tag jde přepsat, SHA ne.
# Aktualizace hlídá Dependabot (.github/dependabot.yml).
permissions:
  contents: read

jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        include:
          - target: x86_64-pc-windows-msvc
            os: windows-latest
          - target: x86_64-unknown-linux-gnu
            os: ubuntu-latest
          - target: x86_64-apple-darwin
            os: macos-latest
          - target: aarch64-apple-darwin
            os: macos-latest
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: dtolnay/rust-toolchain@b725eda525362e7cf34af9a7243cac1e3f01a7ec # stable
        with:
          targets: ${{ matrix.target }}
      - uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2.9.3
        with:
          key: ${{ matrix.target }}
      - name: build
        run: cargo build --release --target ${{ matrix.target }}
      - name: package (windows)
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          $v = "${{ github.ref_name }}".TrimStart("v")
          Compress-Archive -Path "target/${{ matrix.target }}/release/mdprint.exe" `
            -DestinationPath "mdprint-$v-${{ matrix.target }}.zip"
      - name: package (unix)
        if: runner.os != 'Windows'
        run: |
          v="${GITHUB_REF_NAME#v}"
          tar -C "target/${{ matrix.target }}/release" -czf \
            "mdprint-$v-${{ matrix.target }}.tar.gz" mdprint
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: mdprint-${{ matrix.target }}
          path: |
            mdprint-*.zip
            mdprint-*.tar.gz
          if-no-files-found: error

  release:
    needs: build
    runs-on: ubuntu-latest
    permissions:
      contents: write      # vytvoření GitHub Release
      id-token: write      # Sigstore podpis atestací
      attestations: write  # uložení atestací provenance
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4.3.0
        with:
          path: dist
          merge-multiple: true
      - name: checksums
        run: |
          cd dist
          sha256sum mdprint-* > SHA256SUMS
      # Provenance (SLSA) pro každou binárku: ověření
      #   gh attestation verify mdprint-*.zip --repo filip-cokesh/mdprint
      - uses: actions/attest-build-provenance@4d101475d8b20a2381f78447822ac1eab6504dd8 # v4.2.2
        with:
          subject-path: dist/mdprint-*
      - name: extract changelog section
        run: |
          v="${GITHUB_REF_NAME#v}"
          awk -v ver="$v" '
            $0 ~ "^## \\[" ver "\\]" { on=1; next }
            on && /^## \[/ { exit }
            on { print }
          ' CHANGELOG.md > release-notes.md
          cat release-notes.md
      - uses: softprops/action-gh-release@3bb12739c298aeb8a4eeaf626c5b8d85266b0e65 # v2.6.2
        with:
          files: |
            dist/mdprint-*
            dist/SHA256SUMS
          body_path: release-notes.md

  # crates.io přes Trusted Publishing (OIDC, bez uloženého tokenu). Vyžaduje
  # registraci na crates.io: Settings crate → Trusted Publishing → GitHub,
  # owner filip-cokesh, repo mdprint, workflow release.yml, environment release.
  # Běží až po GitHub Release — selhání publishe nebrání binárkám.
  publish:
    needs: release
    runs-on: ubuntu-latest
    environment: release
    permissions:
      contents: read
      id-token: write      # OIDC token pro crates.io
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: dtolnay/rust-toolchain@b725eda525362e7cf34af9a7243cac1e3f01a7ec # stable
      - uses: rust-lang/crates-io-auth-action@3268eb413133e2960fa4ae0e963ca76380c54cd9 # v1.0.6
        id: auth
      - name: cargo publish
        run: cargo publish
        env:
          CARGO_REGISTRY_TOKEN: ${{ steps.auth.outputs.token }}
