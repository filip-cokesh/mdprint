name: Release

on:
  push:
    tags: ["v*"]

env:
  CARGO_TERM_COLOR: always

permissions:
  contents: write

jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        include:
          - target: x86_64-pc-windows-msvc
            os: windows-latest
          - target: x86_64-unknown-linux-gnu
            os: ubuntu-latest
          - target: x86_64-apple-darwin
            os: macos-latest
          - target: aarch64-apple-darwin
            os: macos-latest
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.target }}
      - uses: Swatinem/rust-cache@v2
        with:
          key: ${{ matrix.target }}
      - name: build
        run: cargo build --release --target ${{ matrix.target }}
      - name: package (windows)
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          $v = "${{ github.ref_name }}".TrimStart("v")
          Compress-Archive -Path "target/${{ matrix.target }}/release/mdprint.exe" `
            -DestinationPath "mdprint-$v-${{ matrix.target }}.zip"
      - name: package (unix)
        if: runner.os != 'Windows'
        run: |
          v="${GITHUB_REF_NAME#v}"
          tar -C "target/${{ matrix.target }}/release" -czf \
            "mdprint-$v-${{ matrix.target }}.tar.gz" mdprint
      - uses: actions/upload-artifact@v4
        with:
          name: mdprint-${{ matrix.target }}
          path: |
            mdprint-*.zip
            mdprint-*.tar.gz
          if-no-files-found: error

  release:
    needs: build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          path: dist
          merge-multiple: true
      - name: checksums
        run: |
          cd dist
          sha256sum mdprint-* > SHA256SUMS
      - name: extract changelog section
        run: |
          v="${GITHUB_REF_NAME#v}"
          awk -v ver="$v" '
            $0 ~ "^## \\[" ver "\\]" { on=1; next }
            on && /^## \[/ { exit }
            on { print }
          ' CHANGELOG.md > release-notes.md
          cat release-notes.md
      - uses: softprops/action-gh-release@v2
        with:
          files: |
            dist/mdprint-*
            dist/SHA256SUMS
          body_path: release-notes.md
